<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F0EE">
<title>Sketch Prompts</title>
<style>
  :root {
    --bg: #F1F0EE;
    --ink: #141414;
    --muted: #6b6a66;
    --orange: #EF8444;
    --orange-dark: #D96A28;
    --pink: #FDC2FE;
    --pink-dark: #F4A8F6;
    --green: #3F7A62;
    --green-dark: #2F634D;
    --blue: #A6C0F3;
    --beige: #D8D8C9;
    --yellow: #E5E888;
    --white: #ffffff;
    --line: rgba(20,20,20,.12);
    --sans: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  html.lock, html.lock body { overflow: hidden; }
  body { font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  h1, h2 { font-weight: 800; letter-spacing: -0.02em; margin: 0; }

  .app {
    min-height: 100vh; min-height: 100dvh;
    max-width: 560px; margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) clamp(16px, 4vw, 24px) max(20px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 16px;
  }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: clamp(1.6rem, 6vw, 2rem); }
  .progress { font-size: .85rem; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }

  .card {
    position: relative;
    min-height: 220px;
    display: flex; flex-direction: column; justify-content: space-between; gap: 16px;
    background: var(--blue);
    border-radius: 24px;
    padding: 20px;
    transition: background-color 1.2s ease, color 1.2s ease;
  }
  /* quick fade to green, slow fade back */
  .card.is-done { background: var(--green); color: var(--white); transition-duration: .25s; }
  .card.is-empty { background: var(--beige); }
  .num { font-size: .8rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; opacity: .7; min-height: 1.2em; }
  .prompt-wrap { flex: 1; display: flex; align-items: center; }
  .prompt { font-size: clamp(1.5rem, 6.4vw, 2.1rem); font-weight: 800; line-height: 1.15; letter-spacing: -0.02em; margin: 0; overflow-wrap: anywhere; }
  .prompt.placeholder { font-size: clamp(1.15rem, 4.5vw, 1.4rem); font-weight: 600; opacity: .65; letter-spacing: 0; }
  .meta { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .material-group { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .meta[hidden] { display: none; }
  .opt { font-size: .75rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; opacity: .7; }
  .chip { display: inline-block; background: var(--yellow); color: var(--ink); font-weight: 700; font-size: .9rem; padding: 6px 12px; border-radius: 999px; }
  .tick {
    position: absolute; top: 16px; right: 16px;
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--green); display: grid; place-items: center;
    opacity: 0; transform: scale(.6);
    transition: opacity .25s ease, transform .25s ease, background-color 1.2s ease;
  }
  .tick[hidden] { display: none; }
  .tick svg { width: 18px; height: 18px; stroke: var(--white); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; transition: stroke 1.2s ease; }
  .card.has-tick .tick { opacity: 1; transform: scale(1); }
  /* during the green flash, invert the tick so it stays visible */
  .card.is-done .tick { background: var(--white); transition-duration: .25s; }
  .card.is-done .tick svg { stroke: var(--green); transition-duration: .25s; }

  .actions { display: flex; flex-direction: column; gap: 10px; }
  button {
    font: inherit; font-weight: 700; cursor: pointer; border: 0; border-radius: 16px;
    height: 56px; min-height: 56px; padding: 0 20px; font-size: 1.05rem;
    -webkit-tap-highlight-color: transparent;
    transition: transform .08s, background .2s, opacity .2s;
  }
  button:active:not(:disabled) { transform: scale(.98); }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .primary { background: var(--pink); color: var(--ink); box-shadow: inset 0 0 0 1.5px rgba(20,20,20,.18); }
  .primary:hover:not(:disabled) { background: var(--pink-dark); }
  .done-btn { background: var(--green); color: var(--white); }
  .done-btn:hover:not(:disabled) { background: var(--green-dark); }
  .ghost { background: var(--white); color: var(--ink); border: 1px solid var(--line); font-size: 1.05rem; }
  .ghost:hover { background: var(--beige); }
  button:disabled { opacity: .4; cursor: not-allowed; }

  /* Full-screen sheet: the .sheet element is the only scroll container */
  dialog {
    position: fixed; inset: 0;
    width: 100%; height: 100%; max-width: none; max-height: none;
    margin: 0; padding: 0; border: 0; overflow: hidden;
    background: var(--bg); color: var(--ink);
  }
  dialog:not([open]) { display: none; }
  .sheet { height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .sheet-inner { max-width: 720px; margin: 0 auto; }
  .sheet-head {
    position: sticky; top: 0; z-index: 2;
    background: var(--bg);
    padding: max(20px, env(safe-area-inset-top)) clamp(16px, 4vw, 24px) 14px;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    border-bottom: 1px solid var(--line);
  }
  .sheet-head h2 { font-size: clamp(1.6rem, 6vw, 2rem); line-height: 1.1; }
  .sheet-head p { margin: 6px 0 0; color: var(--muted); font-size: .9rem; }
  .count { margin-top: 10px; display: inline-block; background: var(--yellow); font-weight: 700; font-size: .8rem; padding: 4px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }
  .close { width: 56px; height: 56px; min-height: 56px; padding: 0; border-radius: 50%; background: var(--white); border: 1px solid var(--line); color: var(--ink); font-size: 1.1rem; flex: none; }
  .close:hover { background: var(--beige); }
  .list { list-style: none; margin: 0; padding: 8px clamp(8px, 3vw, 16px); }
  .row { display: flex; align-items: center; gap: 14px; padding: 12px 8px; border-radius: 12px; cursor: pointer; position: relative; }
  .row:hover { background: rgba(216,216,201,.5); }
  .row input { position: absolute; opacity: 0; pointer-events: none; }
  .box { flex: none; width: 24px; height: 24px; border-radius: 7px; border: 2px solid #9a9a90; background: var(--white); display: grid; place-items: center; transition: background .15s, border-color .15s; }
  .box svg { width: 14px; height: 14px; stroke: var(--white); stroke-width: 3; fill: none; opacity: 0; }
  .row input:checked + .box { background: var(--green); border-color: var(--green); }
  .row input:checked + .box svg { opacity: 1; }
  .row input:focus-visible + .box { outline: 3px solid var(--ink); outline-offset: 2px; }
  .idx { flex: none; width: 2.6ch; text-align: right; color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
  .txt { font-size: 1rem; line-height: 1.35; font-weight: 500; }
  .row input:checked ~ .txt { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(20,20,20,.35); }
  .row.current { background: rgba(239,132,68,.16); }
  .row.current .txt { font-weight: 700; }
  .sheet-foot { padding: 12px clamp(16px, 4vw, 24px) max(28px, env(safe-area-inset-bottom)); }
  .sheet-foot .ghost { width: 100%; }
  .sheet-foot .ghost.confirm { background: var(--orange); border-color: var(--orange); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Sketch Prompts</h1>
    <div class="progress" id="progress" aria-live="polite"></div>
  </header>

  <main class="card is-empty" id="card" aria-live="polite" aria-atomic="true">
    <div class="num" id="num"></div>
    <div class="prompt-wrap"><p class="prompt placeholder" id="prompt">Press “Get prompt” to start</p></div>
    <div class="meta" id="meta" hidden>
      <div class="material-group">
        <span class="opt">Draw with:</span>
        <span class="chip" id="material"></span>
      </div>
    </div>
    <span class="tick" id="badge" role="img" aria-label="Sketch completed" hidden>
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3L12.5 5"/></svg>
    </span>
  </main>

  <div class="actions">
    <button type="button" class="primary" id="getBtn">Get prompt</button>
    <button type="button" class="done-btn" id="doneBtn" disabled>Sketch done!</button>
    <button type="button" class="ghost" id="listBtn">Show all prompts</button>
  </div>
</div>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="sheet" id="sheet">
    <div class="sheet-inner">
      <div class="sheet-head">
        <div>
          <h2 id="dlgTitle">All Prompts</h2>
          <p>Tap a prompt to mark it complete or not.</p>
          <span class="count" id="count" aria-live="polite"></span>
        </div>
        <button type="button" class="close" id="closeBtn" aria-label="Close list">✕</button>
      </div>
      <ul class="list" id="list"></ul>
      <div class="sheet-foot">
        <button type="button" class="ghost" id="clearBtn">Clear all</button>
      </div>
    </div>
  </div>
</dialog>

<script>
(function () {
  var PROMPTS = [
    "Draw your left hand with your right",
    "Draw your most comfortable shoes",
    "Draw your morning coffee cup",
    "Draw your unmade bed",
    "Draw the contents of your bag or wallet",
    "Draw a can of soup",
    "Draw some clutter",
    "Draw your naked foot",
    "Draw your lunch before and after",
    "Draw the view out the nearest window",
    "Draw something you need to replace",
    "Draw an apple, minus a bite or two",
    "Draw a good book",
    "Draw your most complicated appliance",
    "Draw laundry",
    "Draw yourself",
    "Draw your toothbrush",
    "Draw the contents of one shelf in your medicine cabinet",
    "Draw what's under the sink",
    "Draw during a commercial",
    "Draw a bicycle",
    "Draw the dashboard of a car",
    "Draw what's under the hood of your car",
    "Draw your right hand with your left",
    "Draw a bus, inside or out",
    "Draw a bottle of liquor",
    "Draw a slice of toast",
    "Draw part of a tree in detail",
    "Draw some wood grain",
    "Draw the lines on your palm",
    "Draw some money",
    "Draw some dirty dishes",
    "Draw your coffee maker",
    "Draw a dog doing its thing",
    "Draw a vacuum cleaner",
    "Draw a glass of water",
    "Draw someone who's passed away",
    "Draw your driver's license",
    "Draw an onion cut in half",
    "Draw an insect",
    "Draw the corner of a room",
    "Draw the negative space of a chair",
    "Draw a fish, dead or alive",
    "Draw a box of cereal",
    "Draw a stranger",
    "Draw three of your shirts",
    "Draw ten things in twenty minutes",
    "Draw a toilet",
    "Draw a reflection",
    "Draw six shadows",
    "Draw the Mona Lisa",
    "Draw yourself as you were",
    "Draw yourself first thing",
    "Draw yourself looking happy",
    "Draw a shoe from above",
    "Draw a shoe from one side",
    "Draw your breakfast",
    "Draw your pens",
    "Draw someone you admire",
    "Draw someone walking",
    "Draw the last photo you took",
    "Draw your doorway",
    "Draw a picture in a frame",
    "Draw a wild animal",
    "Draw a used tube of toothpaste",
    "Draw a sweater",
    "Draw a coin",
    "Draw a tool",
    "Draw the weather",
    "Draw a map from your childhood",
    "Draw the inside of your fridge",
    "Draw something growing in your house",
    "Draw a bottle of shampoo",
    "Draw some medicine",
    "Draw everything in your pocket",
    "Draw a landmark from memory",
    "Draw a cartoon character from memory",
    "Draw a toy from memory",
    "Draw something scary",
    "Draw something from a movie",
    "Draw something funny",
    "Draw a musical instrument",
    "Draw someone wearing a hat",
    "Draw a horse",
    "Draw a chicken",
    "Draw three different birds",
    "Draw a cat chilling out",
    "Draw yourself in profile",
    "Draw three pieces of unopened mail",
    "Draw whatever's in front of you right now",
    "Draw a seashell",
    "Draw street signage",
    "Draw an old photo, edge to edge",
    "Draw someone sleeping",
    "Draw the view through a door",
    "Draw some splats",
    "Draw whatever is on your kitchen counter",
    "Draw whatever is on your desk",
    "Draw whatever is on your bedside",
    "Draw the view from your bedroom",
    "Draw the view from the toilet"
];
  var TOTAL = PROMPTS.length;
  var KEY = "sketchPrompts.v2";

  // 60% "Anything goes"; the other 40% is split evenly across the other materials
  var MATERIALS = ["Watercolour", "Ink + watercolour", "Ink", "Pencil", "Colouring pencil", "Pastel"];
  var ANYTHING = "Anything goes";
  function rollMaterial() {
    if (Math.random() < 0.6) return ANYTHING;
    return MATERIALS[Math.floor(Math.random() * MATERIALS.length)];
  }

  var $ = function (id) { return document.getElementById(id); };
  var el = {
    card: $("card"), num: $("num"), prompt: $("prompt"), badge: $("badge"),
    meta: $("meta"), material: $("material"),
    progress: $("progress"), getBtn: $("getBtn"), doneBtn: $("doneBtn"),
    listBtn: $("listBtn"), dlg: $("dlg"), sheet: $("sheet"), closeBtn: $("closeBtn"),
    list: $("list"), count: $("count"), clearBtn: $("clearBtn")
  };

  var state = { done: [], current: null, material: null };
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || localStorage.getItem("sketchPrompts.v1") || "null");
    if (saved && Array.isArray(saved.done)) {
      state.done = saved.done.filter(function (n) { return Number.isInteger(n) && n >= 0 && n < TOTAL; });
      if (Number.isInteger(saved.current) && saved.current >= 0 && saved.current < TOTAL) state.current = saved.current;
      if (typeof saved.material === "string") state.material = saved.material;
    }
  } catch (e) {}
  if (state.current !== null && !state.material) state.material = ANYTHING;
  var doneSet = {};
  var flashTimer = null;
  var flashing = false; // green "sketched" state, lasts 3 seconds, never persisted
  state.done.forEach(function (n) { doneSet[n] = true; });

  function save() {
    state.done = Object.keys(doneSet).map(Number);
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }
  function doneCount() { return Object.keys(doneSet).length; }

  function render() {
    var n = doneCount();
    el.progress.textContent = n + " of " + TOTAL + " completed";
    var cur = state.current;
    var hasPrompt = cur !== null && n < TOTAL;
    var isDone = hasPrompt && !!doneSet[cur];
    var showGreen = isDone && flashing;

    el.card.classList.toggle("is-empty", !hasPrompt);
    el.card.classList.toggle("is-done", showGreen);
    el.meta.hidden = !hasPrompt;
    el.card.classList.remove("has-tick");
    el.badge.hidden = true;

    if (hasPrompt) {
      el.num.textContent = "Prompt " + (cur + 1) + " of " + TOTAL;
      el.prompt.textContent = PROMPTS[cur];
      el.prompt.classList.remove("placeholder");
      el.material.textContent = state.material || ANYTHING;
      el.badge.hidden = !isDone;
      el.card.classList.toggle("has-tick", isDone);
    } else if (n === TOTAL) {
      el.num.textContent = "";
      el.prompt.textContent = "All " + TOTAL + " prompts sketched. Nice work!";
      el.prompt.classList.add("placeholder");
    } else {
      el.num.textContent = "";
      el.prompt.textContent = "Press “Get prompt” to start";
      el.prompt.classList.add("placeholder");
    }

    el.doneBtn.disabled = !hasPrompt || isDone;
    el.getBtn.disabled = n === TOTAL;
  }

  function stopFlash() {
    clearTimeout(flashTimer);
    flashing = false;
  }

  function getPrompt() {
    stopFlash();
    var pool = [];
    for (var i = 0; i < TOTAL; i++) {
      if (!doneSet[i] && i !== state.current) pool.push(i);
    }
    if (!pool.length) {
      if (state.current !== null && !doneSet[state.current]) return;
      state.current = null;
    } else {
      state.current = pool[Math.floor(Math.random() * pool.length)];
      state.material = rollMaterial();
    }
    save(); render();
  }

  function markDone() {
    if (state.current === null || doneSet[state.current]) return;
    doneSet[state.current] = true;
    flashing = true;
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function () { flashing = false; render(); }, 3000);
    save(); render(); renderList();
    el.getBtn.focus();
  }

  var CHECK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 5"/></svg>';

  function buildList() {
    var frag = document.createDocumentFragment();
    PROMPTS.forEach(function (text, i) {
      var li = document.createElement("li");
      var label = document.createElement("label");
      label.className = "row";
      label.innerHTML =
        '<input type="checkbox" data-i="' + i + '">' +
        '<span class="box">' + CHECK + '</span>' +
        '<span class="idx">' + (i + 1) + '</span>' +
        '<span class="txt"></span>';
      label.querySelector(".txt").textContent = text;
      li.appendChild(label);
      frag.appendChild(li);
    });
    el.list.appendChild(frag);
  }

  function renderList() {
    var rows = el.list.querySelectorAll(".row");
    for (var i = 0; i < rows.length; i++) {
      rows[i].querySelector("input").checked = !!doneSet[i];
      rows[i].classList.toggle("current", i === state.current);
    }
    el.count.textContent = doneCount() + " of " + TOTAL + " completed";
  }

  el.list.addEventListener("change", function (e) {
    var t = e.target;
    if (!t || !t.matches("input[type=checkbox]")) return;
    var i = Number(t.getAttribute("data-i"));
    if (t.checked) doneSet[i] = true; else delete doneSet[i];
    if (i === state.current) stopFlash();
    save(); render(); renderList();
  });

  var clearTimer = null;
  function resetClear() {
    clearTimeout(clearTimer);
    el.clearBtn.textContent = "Clear all";
    el.clearBtn.classList.remove("confirm");
  }
  el.clearBtn.addEventListener("click", function () {
    if (!el.clearBtn.classList.contains("confirm")) {
      el.clearBtn.textContent = "Tap again to clear all progress";
      el.clearBtn.classList.add("confirm");
      clearTimer = setTimeout(resetClear, 4000);
      return;
    }
    resetClear();
    stopFlash();
    doneSet = {};
    save(); render(); renderList();
  });

  function openList() {
    renderList(); resetClear();
    document.documentElement.classList.add("lock");
    if (typeof el.dlg.showModal === "function") el.dlg.showModal();
    else el.dlg.setAttribute("open", "");
    el.sheet.scrollTop = 0;
  }
  function closeList() {
    resetClear();
    if (typeof el.dlg.close === "function") el.dlg.close();
    else el.dlg.removeAttribute("open");
    document.documentElement.classList.remove("lock");
    el.listBtn.focus();
  }

  el.getBtn.addEventListener("click", getPrompt);
  el.doneBtn.addEventListener("click", markDone);
  el.listBtn.addEventListener("click", openList);
  el.closeBtn.addEventListener("click", closeList);
  el.dlg.addEventListener("cancel", function () { document.documentElement.classList.remove("lock"); });

  buildList();
  render();
})();
</script>
</body>
</html>
